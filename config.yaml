model:
  weight: "weight/BiRefNet-general-epoch_244.pth"
  depth: true
  depth_weight: "weight/Depth-Anything-V2-Small-hf"
  classes: 4

data:
  image_dir: "data/train/image"
  mask_dir: "data/train/mask"
  valid_ratio: 0.1
  sem: true

augment:
  zoom: [0.5, 2.0]
  hide_edges: 0.3
  brightness: 0.2
  contrast: 0.4
  gamma: [0.7, 1.5]
  light: 0.2
  blur: 1.0
  noise: 0.05

loader:
  batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  drop_last: true

train:
  seed: 0
  steps: 5000
  val_every: 250
  save_every: 500
  lr: 1.0e-4
  min_lr: 1.0e-6
  warmup: 200
  weight_decay: 0.01
  grad_clip: 1.0
  accum: 4
  ema: 0.995
  grad_checkpoint: false

loss:
  ce: 1.0
  dice: 1.0
  boundary: 0.5
  boundary_width: 3
  aux: 1.0
  label_blur: 1.0
  teacher: 0.3
  teacher_start: 1000
