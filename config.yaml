model:
  weight: weight/BiRefNet-general-epoch_244.pth
  classes: 4
  depth: false
  depth_weight: weight/Depth-Anything-V2-Small-hf

data:
  image_dir: data/train/image
  mask_dir: data/train/mask
  label_dir: ""
  valid_ratio: 0.1

augment:
  zoom: [0.5, 2.0]
  gamma:
    p: 1.0
    range: [0.7, 1.5]
  shading:
    p: 1.0
    max: 0.2
  blur:
    p: 1.0
    max_sigma: 1.0
  noise:
    p: 1.0
    max_std: 0.05
  hide_edges:
    p: 0.3

loader:
  batch_size: 2
  num_workers: 4

train:
  steps: 5000
  val_every: 250
  save_every: 500
  lr: 0.0001
  head_lr_scale: 10.0
  min_lr: 1.0e-06
  warmup: 200
  weight_decay: 0.01
  grad_clip: 1.0
  accum: 4
  ema: 0.999
  crop: 1024

loss:
  ce: 1.0
  gce_q: 0.7
  dice: 1.0
  boundary: 0.0
  boundary_width: 3
  aux: 0.0
  label_blur: 0.0
  teacher: 0.3
  teacher_start: 1000
  label_weight: 1.0
  mask_weight: 3.0
  label_smooth: 0.05
