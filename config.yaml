model:
  weight: weight/BiRefNet-general-epoch_244.pth
  classes: 4
  depth: false
  depth_weight: weight/Depth-Anything-V2-Small-hf
data:
  image_dir: data/train/image
  mask_dir: data/train/mask
  label_dir: ""
  valid_ratio: 0.1
augment:
  zoom:
  - 0.5
  - 2.0
  hide_edges: 0.3
  brightness: 0.2
  contrast: 0.4
  gamma:
  - 0.7
  - 1.5
  light: 0.2
  blur: 1.0
  noise: 0.05
loader:
  batch_size: 2
  num_workers: 4
train:
  seed: 0
  steps: 5000
  val_every: 250
  save_every: 500
  lr: 0.0001
  min_lr: 1.0e-06
  warmup: 200
  weight_decay: 0.01
  grad_clip: 1.0
  accum: 4
  ema: 0.995
  crop: 512
loss:
  ce: 1.0
  dice: 1.0
  boundary: 0.0
  boundary_width: 3
  aux: 0.0
  label_blur: 0.0
  teacher: 0.0
  teacher_start: 1000
  label_weight: 1.0
  mask_weight: 0.3
  label_smooth: 0.05
  mask_edge: 0
