data:
  image_dir: "data/image"
  mask_dir: "data/mask"
  valid_ratio: 0.1
  is_sem: true
  crop_prob: 1.0
  min_crop_size: 256

augment:
  masking_prob: 1.0
  brightness: 0.2
  contrast: 0.4

loader:
  batch: 1
  num_workers: 2

train:
  ema_decay: 0.99
  max_lr: 1.0e-4
  min_lr: 1.0e-7
  weight_decay: 0.01
  warmup_steps: 50
  max_grad_norm: 1.0
  accum_steps: 1
  steps: 1000
  val_freq: 50
  save_freq: 100

loss:
  lambda_cls: 1.0
  lambda_region: 1.0
  lambda_boundary: 0.5
  boundary_radius: 3
  lambda_aux: 1.0
